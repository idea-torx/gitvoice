name: Feature request
description: Idea for Gitvoice
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: Who benefits and what job are you trying to do?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      placeholder: Sketch the change; note any D1/R2/Workers AI implications.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Worker / API, Admin workspace, Client portal, Agent CLI, PDF / rendering, Docs, Other]
